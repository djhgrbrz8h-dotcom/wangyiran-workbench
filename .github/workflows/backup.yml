name: Auto Backup

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'JSON backup data'
        required: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Save backup
        run: |
          echo '${{ github.event.inputs.data }}' > backup.json
          
      - name: Commit and push
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@bot.local"
          git add backup.json
          git commit -m "Auto backup $(date +%Y-%m-%d)" || echo "No changes"
          git push
