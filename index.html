function renderHome() {
  const visibleTasks = store.tasks.filter(t => !t.hidden && (!t.scheduledDate || t.scheduledDate <= today()));
  const pendingTasks = visibleTasks.filter(t => !t.done).length;
  const publishedCount = store.samples.filter(s => s.status === 'published').length;
  const pendingSamples = store.samples.filter(s => s.status === 'pending').length;
  const todaySchedule = store.schedule.filter(s => s.date === today());
  const todayTasks = visibleTasks.filter(t => !t.done).slice(0, 4);
  const userName = (store.settings && store.settings.userName) || '王一然';
  const nickName = (store.settings && store.settings.nickname) || '溜溜';

  const pendingSampleList = store.samples
    .filter(s => s.status !== 'published') // 未发布的（含 pending 和 repeatable）
    .sort((a, b) => {
      // 排序优先级：超时天数（从多到少）→ 未超时按截止日（从近到远）→ 可反复拍放最后
      const aDead = a.deadline || '9999-99-99';
      const bDead = b.deadline || '9999-99-99';
      const aOverdue = daysBetween(today(), aDead);
      const bOverdue = daysBetween(today(), bDead);
      // repeatable 放最后
      if (a.status === 'repeatable' && b.status !== 'repeatable') return 1;
      if (b.status === 'repeatable' && a.status !== 'repeatable') return -1;
      // 都超时 → 超时多的排前面
      if (aOverdue < 0 && bOverdue < 0) return aOverdue - bOverdue;
      // 一个超时一个没 → 超时的排前面
      if (aOverdue < 0 && bOverdue >= 0) return -1;
      if (bOverdue < 0 && aOverdue >= 0) return 1;
      // 都没超时 → 截止日近的排前面
      return aDead.localeCompare(bDead);
    }).slice(0, 8);

  let html = '';

  // Hero banner
  html += `<div class="hero-banner">
    <h2>${getGreeting()}，${esc(nickName)} ✨</h2>
    <p>${today()} · 今天也是元气满满的一天</p>
    <div class="hero-stats">
      <div class="hero-stat" onclick="goPage('tasks')"><div class="val">${pendingTasks}</div><div class="lbl">待办任务</div></div>
      <div class="hero-stat" onclick="goPage('samples')"><div class="val">${pendingSamples}</div><div class="lbl">待拍样品</div></div>
      <div class="hero-stat" onclick="goPage('samples')"><div class="val">${publishedCount}</div><div class="lbl">已发布</div></div>
    </div>
  </div>`;

  // Search bar
  html += `<div class="home-search-bar" onclick="openSearch()">
    <span class="home-search-icon">🔍</span>
    <span class="home-search-placeholder">搜索待办、样品、日记...</span>
  </div>`;

  // Priority tasks - clickable action sheet
  html += '<div class="card"><div class="card-header"><div class="card-title"><span class="icon">📋</span>今日优先</div><span class="btn-pill-sm" style="background:var(--purple);color:#fff" onclick="goPage(\'tasks\')">查看全部</span></div>';
  if (todayTasks.length === 0) {
    html += '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:15px">暂无待办，去添加吧 ✨</div>';
  } else {
    todayTasks.forEach(t => {
      html += `<div class="task-item" style="cursor:pointer" onclick="showTaskActionSheet('${escAttr(t.id)}')">
        <div class="task-check${t.priority ? ' priority' : ''}">${t.done ? '✓' : ''}</div>
        <div class="task-text${t.done ? ' done' : ''}">${esc(t.title)}</div>
        ${t.bindType === 'sample' ? '<span class="task-badge">样品</span>' : ''}
      </div>`;
    });
  }
  html += '</div>';

  // Pending samples preview
  if (pendingSampleList.length > 0) {
    html += '<div class="section-title">待拍摄样品 <span style="font-size:12px;color:var(--purple);cursor:pointer" onclick="goPage(\'samples\')">更多→</span></div>';
    html += '<div class="card" style="padding:8px">';
    pendingSampleList.forEach(s => {
      const urgClass = 'urgency-' + (s.urgency || 'green');
      html += `<div class="sample-item" style="cursor:pointer;margin-bottom:4px" onclick="showEditSampleModal('${escAttr(s.id)}')">
        <div class="urgency-dot ${urgClass}"></div>
        <div class="sample-info">
          <div class="sample-name">${esc(s.name)}</div>
          <div class="sample-meta">
            <span class="sample-tag">${esc(s.tag || s.cat)}</span>
            ${s.script ? '<span style="font-size:10px;color:var(--success)">📜</span>' : ''}
          </div>
        </div>
        <span style="font-size:14px">⏳</span>
      </div>`;
    });
    html += '</div>';
  }

  // Function grid
  html += '<div class="section-title">功能入口</div>';
  html += '<div class="func-grid">';
  const funcs = [
    { icon: '📖', name: '日记', page: 'diary' }, { icon: '🕳️', name: '树洞', page: 'treehole' },
    { icon: '🏃', name: '运动', page: 'sport' }, { icon: '🎯', name: '专注', page: 'focus' },
    { icon: '🔤', name: '英语', page: 'english' }, { icon: '💰', name: '记账', page: 'bookkeeping' },
    { icon: '📜', name: '脚本库', page: 'scripts' }, { icon: '💡', name: '灵感', page: 'inspiration' }
  ];
  funcs.forEach(f => {
    html += `<div class="func-item" onclick="goPage('${f.page}')"><div class="icon">${f.icon}</div><div class="name">${f.name}</div></div>`;
  });
  html += '</div>';

  // Today's schedule
  if (todaySchedule.length > 0) {
    html += '<div class="section-title">今日日程</div>';
    todaySchedule.forEach(s => {
      html += `<div class="task-item"><span style="font-size:16px">${s.status === 'done' ? '✅' : '📅'}</span>
        <div class="task-text">${esc(s.title)}</div>
        <span class="task-badge">${s.status === 'done' ? '已完成' : '待完成'}</span></div>`;
    });
  }

  return html;
}

function renderSamples() {
  let samples = [...store.samples];
  if (curSampleTab === 'published') samples = samples.filter(s => s.status === 'published');
  else if (curSampleTab === 'repeatable') samples = samples.filter(s => s.status === 'repeatable');
  else if (curSampleTab === 'pending') samples = samples.filter(s => s.status === 'pending');
  else if (curSampleTab === 'overdue') samples = samples.filter(s => {
    // 已超时：截止日已过 + 未发布
    if (s.status === 'published') return false;
    if (!s.deadline) return false;
    return daysBetween(today(), s.deadline) < 0;
  });

  if (curSampleTab === 'pending') {
    // 按紧急程度排序：超时天数多→少→未超时按截止日近→远
    samples.sort((a, b) => {
      const aDead = a.deadline || '9999-99-99';
      const bDead = b.deadline || '9999-99-99';
      const aOverdue = daysBetween(today(), aDead);
      const bOverdue = daysBetween(today(), bDead);
      if (aOverdue < 0 && bOverdue < 0) return aOverdue - bOverdue;
      if (aOverdue < 0) return -1;
      if (bOverdue < 0) return 1;
      return aDead.localeCompare(bDead);
    });
  } else {
    samples.sort((a, b) => new Date(b.addDate || 0) - new Date(a.addDate || 0));
  }

  // 收集所有分类
  const allCats = [...new Set(store.samples.map(s => s.cat).filter(Boolean))];
  const catFilter = curSampleCat || 'all';

  // 按分类筛选
  let filteredSamples = catFilter === 'all' ? samples : samples.filter(s => s.cat === catFilter);

  // 已超时数量
  const overdueCount = store.samples.filter(s => {
    if (s.status === 'published') return false;
    if (!s.deadline) return false;
    return daysBetween(today(), s.deadline) < 0;
  }).length;

  let html = '';
  html += `<div class="sample-tabs">
    <div class="sample-tab${curSampleTab === 'all' ? ' active' : ''}" onclick="curSampleTab='all';curSampleCat='all';renderPage('samples')">全部 ${store.samples.length}</div>
    <div class="sample-tab${curSampleTab === 'overdue' ? ' active' : ''}" onclick="curSampleTab='overdue';curSampleCat='all';renderPage('samples')">已超时 ${overdueCount}</div>
    <div class="sample-tab${curSampleTab === 'pending' ? ' active' : ''}" onclick="curSampleTab='pending';curSampleCat='all';renderPage('samples')">未完成 ${store.samples.filter(s => s.status === 'pending').length}</div>
    <div class="sample-tab${curSampleTab === 'published' ? ' active' : ''}" onclick="curSampleTab='published';curSampleCat='all';renderPage('samples')">已发布 ${store.samples.filter(s => s.status === 'published').length}</div>
    <div class="sample-tab${curSampleTab === 'repeatable' ? ' active' : ''}" onclick="curSampleTab='repeatable';curSampleCat='all';renderPage('samples')">可反复拍 ${store.samples.filter(s => s.status === 'repeatable').length}</div>
  </div>`;

  // 分类筛选标签
  html += '<div class="sample-cat-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">';
  html += `<span class="sample-cat-tab${catFilter === 'all' ? ' active' : ''}" onclick="curSampleCat='all';renderPage('samples')">全部</span>`;
  allCats.forEach(cat => {
    const count = samples.filter(s => s.cat === cat).length;
    html += `<span class="sample-cat-tab${catFilter === cat ? ' active' : ''}" onclick="curSampleCat='${escAttr(cat)}';renderPage('samples')">${esc(cat)} ${count}</span>`;
  });
  html += '</div>';

  html += '<button class="btn-pill-sm" style="background:var(--purple);color:#fff;margin-bottom:12px" onclick="showAddSampleModal()">+ 添加样品</button>';

  if (filteredSamples.length === 0) {
    html += '<div class="empty-state"><div class="icon">📦</div><div class="text">暂无样品</div></div>';
  } else {
    filteredSamples.forEach(s => {
      const urgClass = 'urgency-' + (s.urgency || 'green');
      const statusIcon = s.status === 'published' ? '✅' : s.status === 'repeatable' ? '🔁' : '⏳';
      const statusLabel = s.status === 'published' ? '已发布' : s.status === 'repeatable' ? '可反复拍' : '未完成';
      html += `<div class="sample-item" onclick="showEditSampleModal('${escAttr(s.id)}')" style="cursor:pointer">
        <div class="urgency-dot ${urgClass}"></div>
        <div class="sample-info">
          <div class="sample-name">${esc(s.name)}</div>
          <div class="sample-meta">
            <span class="sample-tag">${esc(s.tag || s.cat)}</span>
            ${s.script ? '<span style="font-size:10px;color:var(--success)">📜</span>' : ''}
            ${s.note ? '<span style="font-size:10px;color:var(--text-muted)">' + esc(s.note) + '</span>' : ''}
          </div>
        </div>
        <span style="font-size:14px;flex-shrink:0" title="${statusLabel}">${statusIcon}</span>
      </div>`;
    });
  }

  return html;
}

function renderTasks() {
  // 只显示未隐藏 + 未到未来日期的待办
  const visibleTasks = store.tasks.filter(t => {
    if (t.hidden) return false;
    if (t.scheduledDate && t.scheduledDate > today()) return false;
    return true;
  });
  const total = visibleTasks.length;
  const done = visibleTasks.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  let html = '';
  html += `<div class="card">
    <div class="card-header"><div class="card-title">📊 今日完成进度</div><span style="font-size:15px;font-weight:700;color:var(--purple-deep)">${pct}%</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:4px">${done}/${total} 已完成</div>
  </div>`;

  html += '<div class="add-task-bar">';
  html += '<input class="add-task-input" id="quickTaskInput" placeholder="快速添加待办..." onkeydown="if(event.key===\'Enter\')addQuickTask()">';
  html += '<button class="btn-pill-sm" style="background:var(--purple);color:#fff" onclick="addQuickTask()">添加</button>';
  html += '</div>';

  const priorityTasks = visibleTasks.filter(t => t.priority);
  const normalTasks = visibleTasks.filter(t => !t.priority);

  const repeatLabel = { daily: '每日', alternate: '隔天', weekly: '每周', biweekly: '每两周', monthly: '每月' };

  function renderTaskList(tasks, title) {
    let h = '';
    if (title) h += '<div class="section-title">' + title + '</div>';
    if (tasks.length === 0 && title) {
      h += '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:13px">暂无</div>';
    }
    tasks.forEach(t => {
      const sample = t.sampleId ? store.samples.find(s => s.id === t.sampleId) : null;
      const repeatBadge = t.repeat && t.repeat !== 'none' ? '<span class="task-badge" style="background:var(--success);color:#fff">' + (repeatLabel[t.repeat] || '') + '</span>' : '';
      h += `<div class="task-item" onclick="showTaskActionSheet('${escAttr(t.id)}')" style="cursor:pointer">
        <div class="task-check${t.done ? ' done' : ''}${t.priority ? ' priority' : ''}" onclick="event.stopPropagation();dispatch('TASK_TOGGLE', {id:'${escAttr(t.id)}'})">${t.done ? '✓' : ''}</div>
        <div class="task-text${t.done ? ' done' : ''}">${esc(t.title)}</div>
        ${sample ? '<span class="task-badge">' + esc(sample.name) + '</span>' : ''}
        ${repeatBadge}
        <span class="task-del" onclick="event.stopPropagation();dispatch('TASK_DELETE', {id:'${escAttr(t.id)}'})">×</span>
      </div>`;
    });
    return h;
  }

  html += renderTaskList(priorityTasks, '🔴 优先任务');
  html += renderTaskList(normalTasks, '📋 普通任务');

  html += '<div style="text-align:center;margin-top:16px">';
  html += '<button class="btn-pill-outline" onclick="showAddTaskModal()">+ 新建待办</button>';
  html += '</div>';

  return html;
}

function renderDiary() {
  const monthDiaries = store.diary.filter(d => getMonthKey(d.date) === curDiaryMonth);
  monthDiaries.sort((a, b) => new Date(b.date) - new Date(a.date));

  let html = '';
  html += '<div class="month-selector">';
  html += '<button onclick="changeDiaryMonth(-1)">◀</button>';
  html += '<span class="label">' + curDiaryMonth + '</span>';
  html += '<button onclick="changeDiaryMonth(1)">▶</button>';
  html += '</div>';

  const todayDiary = store.diary.find(d => d.date === today());
  if (todayDiary && todayDiary.mood) {
    html += `<div class="diary-today-mood">
      <span class="big-emoji">${todayDiary.mood}</span>
      <div class="label">今日心情 · ${today()}</div>
    </div>`;
  } else {
    html += `<div class="diary-today-mood">
      <span class="big-emoji" style="opacity:0.3">📝</span>
      <div class="label">今日还没写日记，点击下方按钮记录</div>
    </div>`;
  }

  html += '<button class="btn-pill-sm" style="background:var(--purple);color:#fff;margin-bottom:12px" onclick="showAddDiaryModal()">+ 写日记</button>';

  if (monthDiaries.length === 0) {
    html += '<div class="empty-state"><div class="icon">📖</div><div class="text">这个月还没有日记<br>开始记录吧</div></div>';
  } else {
    monthDiaries.forEach(d => {
      html += `<div class="diary-entry">
        <div class="diary-date">${d.mood || ''} ${d.weather || ''} · ${d.date}</div>
        <div class="diary-content">${esc(d.content)}</div>
        <div style="text-align:right;margin-top:6px">
          <span style="cursor:pointer;font-size:12px;color:var(--danger)" onclick="dispatch('DIARY_DELETE', {id:'${escAttr(d.id)}'})">🗑️</span>
        </div>
      </div>`;
    });
  }

  return html;
}

function changeDiaryMonth(delta) {
  const [y, m] = curDiaryMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + delta, 1);
  curDiaryMonth = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  renderPage('diary');
}

function sendTreehole() {
  const input = $('#treeholeInput');
  if (!input) return;
  const content = input.value.trim();
  if (!content) return;
  dispatch('TREEHOLE_ADD', { content });
  input.value = '';

  // Auto reply with keyword matching
  setTimeout(() => {
    let reply = '嗯嗯，我在听呢 🌱';
    if (content.includes('累') || content.includes('疲惫')) reply = '辛苦了，休息一下吧。你做得很好 🌙';
    else if (content.includes('开心') || content.includes('高兴')) reply = '真为你开心！继续保持好心情 🎉';
    else if (content.includes('难过') || content.includes('伤心')) reply = '抱抱你，一切都会好起来的 💕';
    else if (content.includes('加油') || content.includes('努力')) reply = '一起加油！未来可期 ✨';
    else if (content.includes('爱') || content.includes('喜欢')) reply = '爱是最美好的力量 💖';
    else if (content.includes('工作') || content.includes('忙')) reply = '工作重要，也要照顾好自己哦 ☕';
    dispatch('TREEHOLE_REPLY', { content: reply });
    const chat = $('#treeholeChat');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }, 500);

  const chat = $('#treeholeChat');
  if (chat) chat.scrollTop = chat.scrollHeight;
}

function renderSport() {
  const weekDays = [];
  const now = new Date();
  const dayOfWeek = now.getDay();
  const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    weekDays.push({ date: ds, day: d.getDate(), isToday: ds === today(), label: ['一', '二', '三', '四', '五', '六', '日'][i] });
  }

  let html = '';

  // ====== 体重管理（日历版） ======
  const weightLogs = store.weightLogs || [];
  const weightGoal = store.weightGoal || null;
  
  // 按日期排序（从旧到新）
  const sortedLogs = [...weightLogs].sort((a, b) => a.date.localeCompare(b.date));
  const latestWeight = sortedLogs.length > 0 ? sortedLogs[sortedLogs.length - 1].weight : null;
  
  // 今日体重
  const todayLogs = weightLogs.filter(w => w.date === today());
  const todayWeight = todayLogs.length > 0 ? todayLogs[todayLogs.length - 1].weight : null;
  
  // 计算较昨日变化
  let changeVsYesterday = null;
  if (todayWeight !== null) {
    const yesterdayStr = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    const yesterdayLog = weightLogs.filter(w => w.date === yesterdayStr);
    if (yesterdayLog.length > 0) {
      changeVsYesterday = todayWeight - yesterdayLog[yesterdayLog.length - 1].weight;
    }
  }
  
  // 构建日期→体重映射
  const dateWeightMap = {};
  weightLogs.forEach(w => { dateWeightMap[w.date] = w.weight; });
  
  // 生成当月日历
  const calNow = new Date();
  const year = calNow.getFullYear();
  const month = calNow.getMonth(); // 0-indexed
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startDow = firstDay.getDay(); // 0=周日
  const todayStr = today();
  
  // 日历单元格
  const calCells = [];
  // 填充月前空白
  for (let i = 0; i < startDow; i++) calCells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const w = dateWeightMap[dateStr] !== undefined ? dateWeightMap[dateStr] : null;
    calCells.push({ day: d, date: dateStr, weight: w, isToday: dateStr === todayStr, isFuture: dateStr > todayStr });
  }
  
  // 计算颜色：与前一个有记录的天比
  const prevRecordDates = sortedLogs.map(l => l.date);
  calCells.forEach((cell, idx) => {
    if (!cell || cell.weight === null) return;
    const prevIdx = prevRecordDates.lastIndexOf(cell.date) - 1;
    if (prevIdx < 0) { cell.trend = 'same'; return; }
    const prevW = dateWeightMap[prevRecordDates[prevIdx]];
    if (prevW === undefined) { cell.trend = 'same'; return; }
    if (cell.weight < prevW - 0.05) cell.trend = 'down';
    else if (cell.weight > prevW + 0.05) cell.trend = 'up';
    else cell.trend = 'same';
  });
  
  // 统计数据
  const now2 = new Date();
  const thisMonday = new Date(now2); thisMonday.setDate(now2.getDate() - ((now2.getDay() + 6) % 7));
  const weekStart = thisMonday.getFullYear() + '-' + String(thisMonday.getMonth() + 1).padStart(2, '0') + '-' + String(thisMonday.getDate()).padStart(2, '0');
  const weekLogs = sortedLogs.filter(l => l.date >= weekStart && l.date <= todayStr);
  const monthLogs = sortedLogs.filter(l => l.date >= (year + '-' + String(month + 1).padStart(2, '0') + '-01') && l.date <= todayStr);
  const weekAvg = weekLogs.length > 0 ? weekLogs.reduce((a, l) => a + l.weight, 0) / weekLogs.length : null;
  const monthAvg = monthLogs.length > 0 ? monthLogs.reduce((a, l) => a + l.weight, 0) / monthLogs.length : null;
  const monthMin = monthLogs.length > 0 ? Math.min(...monthLogs.map(l => l.weight)) : null;
  const monthMax = monthLogs.length > 0 ? Math.max(...monthLogs.map(l => l.weight)) : null;
  const monthMinDate = monthLogs.length > 0 ? monthLogs.reduce((a, b) => a.weight < b.weight ? a : b).date : null;
  const monthMaxDate = monthLogs.length > 0 ? monthLogs.reduce((a, b) => a.weight > b.weight ? a : b).date : null;
  
  // 变化趋势（本周 vs 上周，本月 vs 上月）
  let weekTrend = null;
  if (weekAvg !== null && sortedLogs.length >= 2) {
    const prevWeekStart = (() => { const d = new Date(thisMonday); d.setDate(d.getDate() - 7); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    const prevWeekLogs = sortedLogs.filter(l => l.date >= prevWeekStart && l.date < weekStart);
    if (prevWeekLogs.length > 0) {
      const prevWeekAvg = prevWeekLogs.reduce((a, l) => a + l.weight, 0) / prevWeekLogs.length;
      weekTrend = weekAvg - prevWeekAvg;
    }
  }
  
  let monthTrend = null;
  if (monthAvg !== null && sortedLogs.length >= 2) {
    const prevMonthStart = (() => { const d = new Date(year, month - 1, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; })();
    const prevMonthEnd = (() => { const d = new Date(year, month, 0); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    const prevMonthLogs = sortedLogs.filter(l => l.date >= prevMonthStart && l.date <= prevMonthEnd);
    if (prevMonthLogs.length > 0) {
      const prevMonthAvg = prevMonthLogs.reduce((a, l) => a + l.weight, 0) / prevMonthLogs.length;
      monthTrend = monthAvg - prevMonthAvg;
    }
  }

  html += '<div class="weight-card">';
  html += '<div class="weight-header"><div class="title">⚖️ 体重管理</div></div>';

  // 概览区：当前体重 + 目标进度
  html += '<div class="weight-overview">';
  // 当前体重
  html += '<div class="weight-overview-item">';
  if (todayWeight !== null) {
    html += '<div><span class="num">' + todayWeight.toFixed(1) + '</span><span class="unit"> kg</span></div>';
    if (changeVsYesterday !== null) {
      if (changeVsYesterday < -0.05) html += '<div class="change down">↓ ' + Math.abs(changeVsYesterday).toFixed(1) + ' kg</div>';
      else if (changeVsYesterday > 0.05) html += '<div class="change up">↑ ' + changeVsYesterday.toFixed(1) + ' kg</div>';
      else html += '<div class="change neutral">→ 持平</div>';
    }
  } else {
    html += '<div><span class="num" style="color:var(--text-muted);font-size:20px">--</span></div>';
  }
  html += '<div class="lbl">今日体重</div>';
  html += '</div>';
  // 目标
  html += '<div class="weight-overview-item">';
  if (weightGoal !== null) {
    html += '<div><span class="num">' + weightGoal.toFixed(1) + '</span><span class="unit"> kg</span></div>';
    if (todayWeight !== null) {
      const remain = todayWeight - weightGoal;
      if (remain > 0.05) html += '<div class="change up">还需 ' + remain.toFixed(1) + ' kg</div>';
      else if (remain < -0.05) html += '<div class="change down">已超 ' + Math.abs(remain).toFixed(1) + ' kg</div>';
      else html += '<div class="change neutral">已达成 🎉</div>';
    }
  } else {
    html += '<div><span class="num" style="color:var(--text-muted);font-size:20px">--</span></div>';
    html += '<div class="lbl">未设定</div>';
  }
  html += '<div class="lbl">目标体重</div>';

// ========== WEIGHT FUNCTIONS ==========
function addWeight() {
  const input = document.getElementById('weightInput');
  if (!input) { console.log('addWeight: input not found'); return; }
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 30 || val > 200) {
    toast('请输入有效体重（30-200 kg）');
    return;
  }
  if (!store.weightLogs) store.weightLogs = [];
  // 同一天多次记录则更新最后一条
  const existing = store.weightLogs.filter(w => w.date === today());
  if (existing.length > 0) {
    existing[existing.length - 1].weight = val;
  } else {
    store.weightLogs.push({ id: uid(), weight: val, date: today() });
  }
  store.weightLogs.sort((a, b) => a.date.localeCompare(b.date));
  saveData();
  renderPage('sport');
  toast('体重已记录 ✓');
}

function setWeightGoal() {
  const input = document.getElementById('weightGoalInput');
  if (!input) { console.log('setWeightGoal: input not found'); return; }
  const val = input.value.trim();
  if (val === '') {
    store.weightGoal = null;
    saveData();
    renderPage('sport');
    toast('已清除目标');
    return;
  }
  const num = parseFloat(val);
  if (isNaN(num) || num < 30 || num > 200) {
    toast('请输入有效体重（30-200 kg）');
    return;
  }
  store.weightGoal = num;
  saveData();
  renderPage('sport');
  toast('目标已设定 ✓');
}

function drawWeightChart() {
  const canvas = document.getElementById('weightLineChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = 150 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '150px';
  ctx.scale(dpr, dpr);
  
  const logs = (store.weightLogs || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (logs.length < 2) return;
  
  const padding = { top: 16, right: 16, bottom: 28, left: 40 };
  const w = rect.width;
  const h = 150;
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;
  
  const vals = logs.map(l => l.weight);
  const minVal = Math.floor(Math.min(...vals) - 0.5);
  const maxVal = Math.ceil(Math.max(...vals) + 0.5);
  const range = maxVal - minVal || 1;
  
  const xScale = (i) => padding.left + (i / Math.max(1, logs.length - 1)) * plotW;
  const yScale = (v) => padding.top + plotH - ((v - minVal) / range) * plotH;
  
  ctx.clearRect(0, 0, w, h);
  
  // Grid lines
  ctx.strokeStyle = '#F0E8EC';
  ctx.lineWidth = 0.5;
  for (let v = minVal; v <= maxVal; v += 0.5) {
    const y = yScale(v);
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(w - padding.right, y);
    ctx.stroke();
  }
  
  // Y axis labels
  ctx.fillStyle = '#C8A8B8';
  ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = 'right';
  for (let v = minVal; v <= maxVal; v += 1) {
    ctx.fillText(v.toFixed(1), padding.left - 6, yScale(v) + 3);
  }
  
  // Area gradient
  const grad = ctx.createLinearGradient(0, padding.top, 0, h - padding.bottom);
  grad.addColorStop(0, 'rgba(255,112,160,0.25)');
  grad.addColorStop(1, 'rgba(255,112,160,0.02)');
  
  // Draw area
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(logs[0].weight));
  for (let i = 1; i < logs.length; i++) {
    ctx.lineTo(xScale(i), yScale(logs[i].weight));
  }
  ctx.lineTo(xScale(logs.length - 1), yScale(minVal));
  ctx.lineTo(xScale(0), yScale(minVal));
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Draw line
  ctx.beginPath();
  ctx.moveTo(xScale(0), yScale(logs[0].weight));
  for (let i = 1; i < logs.length; i++) {
    ctx.lineTo(xScale(i), yScale(logs[i].weight));
  }
  ctx.strokeStyle = '#FF70A0';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
  
  // Draw dots
  logs.forEach((l, i) => {
    const x = xScale(i);
    const y = yScale(l.weight);
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = '#FF70A0';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  
  // X axis labels (dates)
  ctx.fillStyle = '#C8A8B8';
  ctx.textAlign = 'center';
  ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
  const labelIndices = [];
  if (logs.length <= 7) {
    logs.forEach((_, i) => labelIndices.push(i));
  } else {
    const step = Math.max(1, Math.floor(logs.length / 6));
    for (let i = 0; i < logs.length; i += step) labelIndices.push(i);
    if (labelIndices[labelIndices.length - 1] !== logs.length - 1) labelIndices.push(logs.length - 1);
  }
  labelIndices.forEach(i => {
    const d = logs[i].date.slice(5);
    ctx.fillText(d, xScale(i), h - padding.bottom + 14);
  });
}

function setSportTimerPreset(min) {
  sportTimerPreset = min * 60;
  sportTimerSeconds = sportTimerPreset;
  updateSportTimerDisplay();
  const finishBtn = $('#sportTimerFinish');
  if (finishBtn) finishBtn.disabled = sportTimerSeconds <= 0;
}

function startSportTimer() {
  if (sportTimerRunning) return;
  if (sportTimerSeconds <= 0) {
    sportTimerPreset = 0;
    sportTimerSeconds = 0;
  }
  sportTimerRunning = true;
  $('#sportTimerStart').disabled = true;
  $('#sportTimerPause').disabled = false;
  $('#sportTimerFinish').disabled = false;
  sportTimerInterval = setInterval(() => {
    if (sportTimerPreset > 0) {
      sportTimerSeconds--;
      if (sportTimerSeconds <= 0) {
        stopSportTimer();
        toast('计时结束！记得点「结束」保存运动记录');
      }
    } else {
      sportTimerSeconds++;
    }
    updateSportTimerDisplay();
  }, 1000);
}

function pauseSportTimer() {
  sportTimerRunning = false;
  clearInterval(sportTimerInterval);
  $('#sportTimerStart').disabled = false;
  $('#sportTimerPause').disabled = true;
}

function resetSportTimer() {
  sportTimerRunning = false;
  clearInterval(sportTimerInterval);
  sportTimerSeconds = 0;
  sportTimerPreset = 0;
  updateSportTimerDisplay();
  $('#sportTimerStart').disabled = false;
  $('#sportTimerPause').disabled = true;
  $('#sportTimerFinish').disabled = true;
}

function stopSportTimer() {
  sportTimerRunning = false;
  clearInterval(sportTimerInterval);
  $('#sportTimerStart').disabled = false;
  $('#sportTimerPause').disabled = true;
}

function finishSportTimer() {
  const minutes = Math.floor(sportTimerSeconds / 60);
  if (minutes < 1) {
    toast('运动时间太短，至少1分钟才能记录');
    return;
  }
  const type = $('#sportTimerType')?.value || '运动';
  stopSportTimer();
  sportTimerSeconds = 0;
  sportTimerPreset = 0;
  updateSportTimerDisplay();
  $('#sportTimerFinish').disabled = true;
  dispatch('SPORT_ADD', { type, duration: minutes, note: '计时器记录' });
  toast('已记录 ' + type + ' ' + minutes + ' 分钟');
}

function updateSportTimerDisplay() {
  const el = $('#sportTimerDisplay');
  if (!el) return;
  const m = Math.floor(sportTimerSeconds / 60);
  const s = sportTimerSeconds % 60;
  el.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

  });

    html += `<option value="${escAttr(t.id)}"${focusTaskId === t.id ? ' selected' : ''}>${esc(t.title)}</option>`;
  });
  html += '</select></div>';

  const todaySessions = store.focus.filter(f => f.date === today());
  if (todaySessions.length > 0) {
    html += '<div class="section-title">今日专注记录</div>';
    todaySessions.forEach(f => {

      </div>`;
    });
  }

  return html;
}

// Focus timer state
let focusDuration = 25;
let focusRemaining = 25 * 60;
let focusElapsed = 0;
let focusRunning = false;
let focusInterval = null;
let focusTaskId = null;

function setFocusPreset(min) {
  focusDuration = min;
  focusRemaining = min * 60;
  focusElapsed = 0;
  focusRunning = false;
  clearInterval(focusInterval);
  renderPage('focus');
}

function setFocusCustom() {
  const val = parseInt($('#focusCustomInput')?.value);
  if (val && val > 0) setFocusPreset(val);
}

function bindFocusTask(id) {
  focusTaskId = id || null;
}

function startFocus() {
  if (focusRunning) return;
  focusRunning = true;
  focusInterval = setInterval(() => {
    focusRemaining--;
    focusElapsed++;
    if (focusRemaining <= 0) {
      pauseFocus();
      const task = focusTaskId ? store.tasks.find(t => t.id === focusTaskId) : null;
      dispatch('FOCUS_ADD', { taskId: focusTaskId, minutes: focusDuration, taskName: task ? task.title : '' });
      toast('专注完成！');
      focusRemaining = focusDuration * 60;
      focusElapsed = 0;
      focusTaskId = null;
    }
    renderPage('focus');
  }, 1000);
  renderPage('focus');
}

function pauseFocus() {
  focusRunning = false;
  clearInterval(focusInterval);
  renderPage('focus');
}

function resetFocus() {
  focusRunning = false;
  clearInterval(focusInterval);
  focusRemaining = focusDuration * 60;
  focusElapsed = 0;
  focusTaskId = null;
  renderPage('focus');
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    toast('📋 链接已复制！去App里粘贴打开');
  } catch (e) {
    toast('复制失败，请长按链接手动复制');
  }
  document.body.removeChild(textarea);
}







function copyToClipboard(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      toast(msg || '已复制');
    }).catch(function() {
      fallbackCopy(text, msg);
    });
  } else {
    fallbackCopy(text, msg);
  }
}

function copyDouyinLink(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      toast('链接已复制');
    }).catch(() => {
      // Fallback
      const textarea = document.createElement('textarea');
      textarea.value = url;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      toast('链接已复制');
    });
  } else {
    const textarea = document.createElement('textarea');
    textarea.value = url;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    toast('链接已复制');
  }
}

function renderSchedule() {
  let html = '';

  const [y, m] = curScheduleDate.split('-').map(Number);
  const firstDay = new Date(y, m - 1, 1).getDay();

  const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1;

  html += '<div class="month-selector">';
  html += '<button onclick="changeScheduleMonth(-1)">◀</button>';
  html += '<span class="label">' + curScheduleDate.slice(0, 7) + '</span>';
  html += '<button onclick="changeScheduleMonth(1)">▶</button>';

  ['一', '二', '三', '四', '五', '六', '日'].forEach(d => {
    html += '<div class="cal-day-header">' + d + '</div>';
  });

  for (let i = 0; i < adjustedFirstDay; i++) {
    html += '<div class="cal-day other"></div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const daySchedules = store.schedule.filter(s => s.date === ds);
    const hasSchedule = daySchedules.length;
    // 未来待办
    const dayTasks = store.tasks.filter(t => t.scheduledDate === ds && !t.hidden);
    const hasTasks = dayTasks.length;
    const isToday = ds === today();
    let emojiStr = '';
    if (hasSchedule > 0) {
      const emojis = daySchedules.slice(0, 2).map(s => s.emoji || '🟢').join('');
      emojiStr = '<div style="font-size:10px;line-height:1">' + emojis + '</div>';
    }
    if (hasTasks > 0) {
      emojiStr += '<div style="font-size:9px;line-height:1;color:var(--purple);margin-top:1px">📌' + hasTasks + '</div>';
    }
    html += `<div class="cal-day${isToday ? ' today' : ''}" onclick="showDaySchedule('${ds}')">
      ${d}${emojiStr}
    </div>`;
  }
  html += '</div>';

  html += '<button class="btn-pill-sm" style="background:var(--purple);color:#fff;margin:12px 0" onclick="showAddScheduleModal()">+ 添加日程</button>';

  const daySchedules = store.schedule.filter(s => s.date === curScheduleDate);

        <div class="task-text" onclick="dispatch('SCHEDULE_TOGGLE', {id:'${escAttr(s.id)}'})">${esc(s.title)}${s.note ? ' · ' + esc(s.note) : ''}</div>

      </div>`;
    });
  }

  // 当天待办
  const dayTasks = store.tasks.filter(t => t.scheduledDate === curScheduleDate && !t.hidden);
  if (dayTasks.length > 0) {
    html += '<div class="section-title">📌 当天待办</div>';

  html += `<div class="bookkeeping-summary-item"><div class="val" style="color:var(--success)">¥${fmt(income)}</div><div class="lbl">收入</div></div>`;
  html += `<div class="bookkeeping-summary-item"><div class="val" style="color:var(--danger)">¥${fmt(expense)}</div><div class="lbl">支出</div></div>`;
  html += '</div>';

  if (income > 0 || expense > 0) {
    const balance = income - expense;
    const total = income + expense;
    const incomePct = total > 0 ? (income / total) * 100 : 0;
    const expensePct = total > 0 ? (expense / total) * 100 : 0;
    const circumference = 2 * Math.PI * 45;
    const incomeDash = (incomePct / 100) * circumference;
    const expenseDash = (expensePct / 100) * circumference;

    html += '<div class="bookkeeping-donut-wrap">';
    html += '<div class="bookkeeping-donut">';
    html += `<svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">
      <circle cx="60" cy="60" r="45" fill="none" stroke="var(--border)" stroke-width="12"/>
      <circle cx="60" cy="60" r="45" fill="none" stroke="var(--success)" stroke-width="12"
        stroke-dasharray="${incomeDash} ${circumference}" stroke-dashoffset="0"/>
      <circle cx="60" cy="60" r="45" fill="none" stroke="var(--danger)" stroke-width="12"
        stroke-dasharray="${expenseDash} ${circumference}" stroke-dashoffset="${-incomeDash}"/>
    </svg>`;
    html += `<div class="bookkeeping-donut-center"><div class="val" style="color:${balance >= 0 ? 'var(--success)' : 'var(--danger)'}">¥${fmt(balance)}</div><div class="lbl">结余</div></div>`;
    html += '</div>';
    html += '<div class="bookkeeping-legend">';
    html += `<div class="bookkeeping-legend-item"><span class="bookkeeping-legend-dot" style="background:var(--success)"></span>收入 ${incomePct.toFixed(0)}%</div>`;
    html += `<div class="bookkeeping-legend-item"><span class="bookkeeping-legend-dot" style="background:var(--danger)"></span>支出 ${expensePct.toFixed(0)}%</div>`;
    html += '</div>';
    html += '</div>';
  }

  if (expense > 0) {
    html += '<div class="section-title">支出分类</div>';
    const catTotals = {};
    monthEntries.filter(b => b.type === 'expense').forEach(b => {
      catTotals[b.category] = (catTotals[b.category] || 0) + b.amount;
    });
    const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
    const maxCatVal = Math.max(...sortedCats.map(c => c[1]), 1);
    sortedCats.forEach(([cat, val]) => {
      const pct = (val / maxCatVal) * 100;
      const icon = getCategoryIcon(cat);
      html += `<div class="bookkeeping-cat-bar">
        <div class="cat-label"><span>${icon} ${esc(cat)}</span><span>¥${fmt(val)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--danger)"></div></div>
      </div>`;
    });
  }

  html += '<button class="btn-pill-sm" style="background:var(--purple);color:#fff;margin:12px 0" onclick="showAddBookkeepingModal()">+ 记一笔</button>';

  if (monthEntries.length === 0) {
    html += '<div class="empty-state"><div class="icon">💰</div><div class="text">本月暂无记录</div></div>';
  } else {
    monthEntries.forEach(b => {
      html += `<div class="bookkeeping-row ${b.type}">
        <div class="cat">${getCategoryIcon(b.category)}</div>
        <div class="info">
          <div>${esc(b.category)}</div>
          ${b.note ? '<div style="font-size:11px;color:var(--text-muted)">' + esc(b.note) + '</div>' : ''}
          <div style="font-size:10px;color:var(--text-muted)">${b.date}</div>
        </div>
        <div class="amount ${b.type}">${b.type === 'income' ? '+' : '-'}¥${fmt(b.amount)}</div>
        <span class="task-del" onclick="dispatch('BOOKKEEPING_DELETE', {id:'${escAttr(b.id)}'})">×</span>
      </div>`;
    });
  }

  return html;
}

function getCategoryIcon(cat) {
  const map = { '餐饮': '🍜', '交通': '🚗', '购物': '🛍️', '住房': '🏠', '娱乐': '🎮', '医疗': '💊', '教育': '📚', '收入': '💵', '品牌合作': '🤝', '其他': '📌' };
  return map[cat] || '📌';
}

function changeBookkeepingMonth(delta) {
  const [y, m] = curBookkeepingMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + delta, 1);
  curBookkeepingMonth = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  renderPage('bookkeeping');
}

// ==================== API FUNCTIONS ====================

function exportData() {
  const data = JSON.stringify(store, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const fileName = 'wyr_backup_' + today() + '.json';
  // iOS 用分享方式保存，其他用下载
  if (navigator.share && navigator.canShare) {
    const file = new File([blob], fileName, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '备份数据' }).then(() => {
        toast('备份成功 ✅');
      }).catch(() => { toast('已取消'); });
      return;
    }
  }
  // 兜底：传统下载方式
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('数据已导出');
}

function importDataPrompt() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('导入数据将覆盖当前数据，确认？')) {
          Object.keys(store).forEach(k => delete store[k]);
          Object.assign(store, data);
          if (!store.settings) store.settings = {};
          if (!store.settings.userName) store.settings.userName = '王一然';
          if (!store.settings.nickname) store.settings.nickname = '溜溜';
          if (!store.settings.city) store.settings.city = '北京';
          if (!store.settings.avatar) store.settings.avatar = '';
          if (!store.settings.theme) store.settings.theme = 'pink-purple';
          if (!store.podcastHistory) store.podcastHistory = [];
          if (!store.sportTypes) store.sportTypes = ['跑步', '散步', '瑜伽', '力量训练', '骑行', '游泳', '舞蹈', '跳绳', 'HIIT', '普拉提'];
          if (!store.englishVocab) store.englishVocab = [];
          if (store.englishDay === undefined) store.englishDay = 1;
          if (!store.samples || store.samples.length === 0) {
            store.samples = initDefaultSamples();
          }
          saveData();
          applyTheme(store.settings.darkMode);
          applyColorTheme(store.settings.theme);
          toast('数据已导入');
          goPage('home');
        }
      } catch (e) {
        toast('文件格式错误', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function init() {
  applyTheme(store.settings.darkMode);

  // Show splash only first time each day
  const today = new Date().toISOString().slice(0,10);
  const lastSplashDate = localStorage.getItem('wyr_splash_date');
  if (lastSplashDate !== today) {
    $('#splash').style.display = 'flex';
    renderSplash();
    localStorage.setItem('wyr_splash_date', today);
  } else {
    $('#splash').style.display = 'none';
  }
  goPage('home');

  checkDailyReset();
  setupSwipe();

  $('#modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  $('#drawerOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeDrawer();
  });

  document.body.addEventListener('touchmove', function(e) {
    if (e.target.closest('.main') || e.target.closest('.drawer-nav') || e.target.closest('.search-results') || e.target.closest('.modal-sheet')) return;
  }, { passive: false });

  if (store.settings.autoBackup && store.settings.lastBackupDate !== today()) {
    store.settings.lastBackupDate = today();
    saveData();
  }
}

function checkDailyReset() {
  const lastCheck = localStorage.getItem('wyr_last_check');
  const todayStr = today();
  if (lastCheck !== todayStr) {
    // 昨天已完成的非重复待办 → 隐藏（不删除，统计仍计入）
    if (lastCheck) {
      store.tasks.forEach(t => {
        if (t.done && (!t.repeat || t.repeat === 'none')) {
          t.hidden = true;
        }
      });
    }
    // 重复待办到期 → 重置为未完成
    const now = new Date();
    const dayOfWeek = now.getDay();
    const dayOfMonth = now.getDate();
    store.tasks.forEach(t => {
      if (t.repeat && t.repeat !== 'none') {
        let shouldReset = false;
        if (t.repeat === 'daily') shouldReset = true;
        else if (t.repeat === 'alternate') {
          // 隔天（每两天一次）：距离上次完成达到2天才重置
          if (t.lastDoneDate) {
            const daysSince = Math.floor((new Date(todayStr) - new Date(t.lastDoneDate)) / 86400000);
            if (daysSince >= 2) shouldReset = true;
          } else { shouldReset = true; }
        }
        else if (t.repeat === 'weekly' && t.repeatDay === dayOfWeek) shouldReset = true;
        else if (t.repeat === 'biweekly' && t.repeatDay === dayOfWeek) {
          // 每两周一次：检查距离上次完成是否达到14天
          if (t.lastDoneDate) {
            const daysSince = Math.floor((new Date(todayStr) - new Date(t.lastDoneDate)) / 86400000);
            if (daysSince >= 14) shouldReset = true;
          } else { shouldReset = true; }
        }
        else if (t.repeat === 'monthly' && dayOfMonth === 1) shouldReset = true;
        if (shouldReset) {
          t.done = false;
          t.hidden = false;
        }
      }
    });
    localStorage.setItem('wyr_last_check', todayStr);
    saveData();
  }
}

function setupSwipe() {
  let touchStartX = 0;
  let touchStartY = 0;

  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      const tabPages = ['home', 'samples', 'tasks', 'ledger', 'profile'];
      const idx = tabPages.indexOf(curPage);
      if (idx !== -1) {
        if (dx < -40 && idx < tabPages.length - 1) {
          goPage(tabPages[idx + 1]);
        } else if (dx > 40 && idx > 0) {
          goPage(tabPages[idx - 1]);
        }
      }
    }
  }, { passive: true });
}
